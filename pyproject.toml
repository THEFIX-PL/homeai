[project]
name = "homeai"
version = "0.1.0"
description = "Home intelligence for Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TRY", "PTH"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # typographic dashes and quotes in texts are intended
  "PLR0911",  # many returns: validators and classifiers read best as early returns
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "PLR2004",  # magic values: thresholds live in the settings registry; tests compare literals
  "PLR0124",  # `v == v` is the NaN check
  "PLC0415",  # lazy imports keep optional parts of Home Assistant off the import path
  "TRY003",
  "TRY300",
  "TRY400",
  "SIM105",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.homeai"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
