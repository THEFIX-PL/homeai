[project]
name = "homeai"
version = "0.0.1"
description = "Home intelligence for Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "TRY", "PTH"]
ignore = ["PLR0913", "TRY003"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.homeai"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
