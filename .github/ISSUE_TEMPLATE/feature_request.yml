name: Feature request
description: Suggest an idea for HomeAI.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What would you like HomeAI to notice, decide or do, and in what situation?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: home
    attributes:
      label: Your setup
      description: Integrations and devices involved, if relevant.
