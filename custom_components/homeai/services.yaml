report_signal:
  fields:
    id:
      required: true
      example: washing_machine_filter
      selector:
        text:
    title:
      required: true
      example: Clean the washing machine filter
      selector:
        text:
    description:
      selector:
        text:
          multiline: true
    severity:
      default: 1
      selector:
        number:
          min: 0
          max: 4
          mode: box
    category:
      default: info
      selector:
        select:
          translation_key: category
          options: [safety, security, damage, system, energy, comfort, maintenance, info]
    need:
      default: member
      selector:
        select:
          translation_key: need
          options: [nobody, member, admin, service]
    entities:
      selector:
        entity:
          multiple: true
    group:
      selector:
        text:
    expires_minutes:
      selector:
        number:
          min: 1
          max: 525600
          unit_of_measurement: min
          mode: box
clear_signal:
  fields:
    id:
      required: true
      selector:
        text:
acknowledge:
  fields:
    situation_id:
      selector:
        text:
handle:
  fields:
    situation_id:
      selector:
        text:
snooze:
  fields:
    situation_id:
      selector:
        text:
    minutes:
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
          mode: box
dismiss:
  fields:
    situation_id:
      required: true
      selector:
        text:
send_digest:
approve:
  fields:
    approval_id:
      required: true
      selector:
        text:
deny:
  fields:
    approval_id:
      required: true
      selector:
        text:
undo:
  fields:
    action_id:
      required: true
      selector:
        text:
plan_add:
  fields:
    title:
      selector:
        text:
    service:
      example: light.turn_on
      selector:
        text:
    entity_id:
      selector:
        entity:
          multiple: true
    data:
      selector:
        object:
    reminder:
      selector:
        text:
          multiline: true
    to:
      default: home_or_all
      selector:
        select:
          translation_key: plan_to
          options: [all, home, home_or_all, admins]
    kind:
      required: true
      default: daily
      selector:
        select:
          translation_key: plan_kind
          options: [once, daily, weekly, sun]
    time:
      example: "07:30"
      selector:
        time:
    date:
      selector:
        date:
    days:
      selector:
        select:
          multiple: true
          translation_key: weekday
          options: ["0", "1", "2", "3", "4", "5", "6"]
    event:
      selector:
        select:
          translation_key: sun_event
          options: [sunrise, sunset, dawn, dusk, solar_noon]
    offset:
      selector:
        number:
          min: -720
          max: 720
          unit_of_measurement: min
          mode: box
    skip_when_away:
      default: false
      selector:
        boolean:
plan_remove:
  fields:
    entry_id:
      required: true
      selector:
        text:
plan_skip:
  fields:
    entry_id:
      required: true
      selector:
        text:
    date:
      required: true
      selector:
        date:
presence_add:
  fields:
    kind:
      required: true
      default: vacation
      selector:
        select:
          translation_key: presence_kind
          options: [away, vacation, guests, home_office, sick]
    person:
      selector:
        entity:
          domain: person
    start:
      required: true
      selector:
        datetime:
    end:
      required: true
      selector:
        datetime:
    note:
      selector:
        text:
presence_remove:
  fields:
    exception_id:
      required: true
      selector:
        text:
ask:
  fields:
    text:
      required: true
      example: Is anything open at home?
      selector:
        text:
          multiline: true
    conversation_id:
      selector:
        text:
run_mission:
  fields:
    mission:
      required: true
      selector:
        select:
          translation_key: mission
          options: [triage, investigate, arbitrate, digest, review, learn]
    situation_id:
      selector:
        text:
watch:
  fields:
    entity_id:
      required: true
      selector:
        entity:
    condition:
      required: true
      selector:
        select:
          translation_key: watch_condition
          options: [state, not_state, above, below, changes]
    value:
      selector:
        text:
    message:
      selector:
        text:
    hours:
      selector:
        number:
          min: 0.1
          max: 168
          step: 0.5
          unit_of_measurement: h
